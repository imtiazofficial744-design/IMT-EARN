<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw | IMT EARN</title>

<link rel="icon" href="logo.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3f8;
color:#222;
}

.top-header{
display:flex;
align-items:center;
justify-content:space-between;
padding:18px 20px;
background:linear-gradient(135deg,#0d6efd,#0044aa);
color:#fff;
box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.header-logo{
display:flex;
align-items:center;
gap:10px;
}

.logo{
width:45px;
height:45px;
border-radius:50%;
background:#fff;
padding:3px;
}

.container{
max-width:600px;
margin:25px auto;
padding:15px;
}

.card{
background:#fff;
padding:20px;
border-radius:18px;
box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.card h2{
text-align:center;
margin-bottom:20px;
color:#0d6efd;
}

.input-box{
margin-bottom:15px;
}

.input-box label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

.input-box input,
.input-box select{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
outline:none;
}

.input-box input:focus,
.input-box select:focus{
border-color:#0d6efd;
}

.submit-btn{
width:100%;
padding:15px;
background:#16a34a;
color:#fff;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.submit-btn:hover{
background:#12803b;
}

.back-btn{
width:100%;
padding:15px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.back-btn:hover{
background:#0b5ed7;
}

.status-box{
margin-top:20px;
padding:15px;
background:#fff8dc;
border-left:5px solid orange;
border-radius:10px;
font-weight:bold;
color:#444;
}

footer{
text-align:center;
padding:20px;
font-size:14px;
color:#666;
}

</style>

</head>
<body>

<header class="top-header">

<div class="header-logo">
<img src="logo.png" class="logo">
<h2>IMT EARN</h2>
</div>

</header>

<div class="container">

<div class="card">

<h2>💸 Withdraw Request</h2>

<div class="input-box">
<label>Withdraw Amount</label>
<input
type="number"
id="amount"
placeholder="Enter Amount">
</div>

<div class="input-box">
<label>Payment Method</label>

<select id="method">

<option value="EasyPaisa">
EasyPaisa
</option>

<option value="JazzCash">
JazzCash
</option>

<option value="NayaPay">
NayaPay
</option>

<option value="SadaPay">
SadaPay
</option>

</select>

</div>

<div class="input-box">
<label>Account Number</label>

<input
type="text"
id="accountNumber"
placeholder="03XXXXXXXXX">

</div>

<div class="input-box">
<label>Account Holder Name</label>

<input
type="text"
id="accountName"
placeholder="Enter Account Holder Name">

</div>

<button class="submit-btn" id="submitBtn">

Submit Withdraw Request

</button>

<button class="back-btn" id="backBtn">

⬅ Back To Dashboard

</button>

<div class="status-box">

Status:
<b id="statusText">

No Request

</b>

</div>

</div>

</div>

<footer>

© 2026 IMT EARN

</footer>
<script type="module">
<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

let currentUser = null;

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="login.html";

return;

}

currentUser=user;

});

document.getElementById("submitBtn").addEventListener("click",async()=>{

const amount=document.getElementById("amount").value.trim();
const method=document.getElementById("method").value;
const accountNumber=document.getElementById("accountNumber").value.trim();
const accountName=document.getElementById("accountName").value.trim();

if(amount==""||accountNumber==""||accountName==""){

alert("Please fill all fields.");

return;

}

try{

await addDoc(collection(db,"withdrawRequests"),{

uid:currentUser.uid,

email:currentUser.email,

amount:Number(amount),

method:method,

accountNumber:accountNumber,

accountName:accountName,

status:"Pending",

createdAt:serverTimestamp()

});

document.getElementById("statusText").innerText="Pending ⏳";

alert("Withdraw Request Submitted Successfully.");

document.getElementById("amount").value="";
document.getElementById("accountNumber").value="";
document.getElementById("accountName").value="";

}catch(error){

alert(error.message);

}

});

document.getElementById("backBtn").addEventListener("click",()=>{

window.location.href="index.html";

});

</script>

</body>

</html>
</script>

</body>

</html>
